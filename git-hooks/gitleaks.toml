# gitleaks の共通設定。リポジトリに .gitleaks.toml が無いときに gitleaks.sh が使う。
# 既定ルール一式を継承した上で、既定に無いルールと検査器自身の除外だけを足す。
#
# リポジトリ固有の誤検知を除外したいときは、そのリポジトリに .gitleaks.toml を置く
# (このファイルを写して allowlist を足す)。除外には必ず理由をコメントで残すこと。

[extend]
useDefault = true

# Discord の Webhook URL。URL を知っていれば誰でもそのチャンネルへ投稿できるのに、
# 既定ルールには Discord のトークン類しか無く、Webhook URL は素通りする。
# scan.sh にも同じ形を足してある。
[[rules]]
id = "discord-webhook-url"
description = "Discord Webhook URL"
regex = '''https://(?:(?:canary|ptb)\.)?discord(?:app)?\.com/api/(?:v\d+/)?webhooks/\d{17,20}/[A-Za-z0-9_-]{60,}'''
keywords = ["discord"]

[allowlist]
description = "検査器自身の除外"

paths = [
  # スキャナ自身。検出パターンの見本を持っているので必ず引っかかる。
  '''git-hooks/scan\.sh''',
  '''git-hooks/gitleaks\.toml''',
]
