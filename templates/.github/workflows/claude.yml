# Claude (PR / Issue で /claude と書いたときだけ動く)。本体は noxitro/github-templates の共通ワークフロー。
# 使い方・認証・権限の説明は共通側 (.github/workflows/claude-agent.yml) の冒頭。
#
# Secret: CLAUDE_CODE_OAUTH_TOKEN (必須)、AGENT_APP_ID / AGENT_APP_PRIVATE_KEY (任意、自前の GitHub App)。
# issue_comment で起動するワークフローは既定ブランチの版が使われるので、既定ブランチに入ってから効く。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # 共通側の job が使う権限。呼び出し側で与えないと共通側では広げられない。
    permissions:
      contents: read
      pull-requests: write   # レビューコメントを書く
      issues: write          # 会話欄に返信する
      id-token: write        # Claude GitHub App の認証に使う
      actions: read          # CI の結果を読んで答えられるように
    uses: noxitro/github-templates/.github/workflows/claude-agent.yml@main
    # 共通側で使う Secret だけを渡す (secrets: inherit だとリポジトリの Secret がすべて渡る)。
    # 無いものは空のまま渡り、共通側で扱う。
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AGENT_APP_ID: ${{ secrets.AGENT_APP_ID }}
      AGENT_APP_PRIVATE_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
