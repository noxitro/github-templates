# このリポジトリ自身の検査。git-hooks/ と共通の Secret scan を、変更した版のまま動かして確かめる。
name: Self check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 共通ワークフローを、検査器もこの push / PR の版にして呼ぶ。
  secret-scan:
    uses: ./.github/workflows/secret-scan.yml
    with:
      hooks-ref: ${{ github.sha }}

  # 共通の Workflow lint / File format も同じく変更した版で動かす (必須チェックではない)。
  workflow-lint:
    uses: ./.github/workflows/workflow-lint.yml
    with:
      python-paths: "git-hooks scripts templates/.github/scripts"

  file-format:
    uses: ./.github/workflows/file-format.yml
    with:
      hooks-ref: ${{ github.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in git-hooks/pre-commit git-hooks/commit-msg git-hooks/pre-push git-hooks/post-* git-hooks/*.sh templates/.claude/hooks/*.sh; do
            sh -n "$f" && echo "ok: $f"
          done
          # scripts/ は bash 前提 (配列・プロセス置換を使う)
          for f in scripts/*.sh; do
            bash -n "$f" && echo "ok: $f"
          done
          python3 -m py_compile git-hooks/check-external-names.py
          python3 -m py_compile git-hooks/fix-format.py scripts/discord_webhook.py scripts/file-format/*.py templates/.github/scripts/*.py
      # Windows の sh は CRLF のスクリプトを読めない。.gitattributes で LF に固定しているが、
      # 既に CRLF で入ってしまったものはそれでは直らないので、ここで止める。
      - name: Line endings
        shell: bash
        run: |
          set -euo pipefail
          bad=$(git ls-files --eol | awk '$1 != "i/lf" && $1 != "i/none" && $1 != "i/-text"' || true)
          if [ -n "$bad" ]; then
            echo "::error::LF でないファイルがある"
            echo "$bad"
            exit 1
          fi
      - name: ShellCheck
        run: shellcheck -S error git-hooks/pre-commit git-hooks/commit-msg git-hooks/pre-push git-hooks/post-* git-hooks/*.sh templates/.claude/hooks/*.sh scripts/*.sh tests/*.sh
      # 公開しているこのリポジトリに、非公開リポジトリの名前を書く一覧を戻さない。
      # 経由先や許可するリポジトリは手元の ~/.config/nox/ に置く (README の「手元にだけ置く一覧」)。
      - name: Private lists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch git-hooks/org-context-allowed.txt >/dev/null 2>&1; then
            echo "::error::git-hooks/org-context-allowed.txt は手元 (~/.config/nox/) に置く。リポジトリには置かない"
            exit 1
          fi
          bad=$(tr -d '\r' < git-hooks/publish-gated.txt | grep -v -e '^#' -e '^[[:space:]]*$' | awk 'NF != 1' || true)
          if [ -n "$bad" ]; then
            echo "::error::publish-gated.txt には公開リポジトリの名前だけを書く (経由先の非公開リポジトリは手元の publish-gate.txt)"
            exit 1
          fi
      - name: push-guard
        shell: bash
        run: bash tests/push-guard.sh
