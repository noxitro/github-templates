# Claude の共通ワークフロー。PR のコメント (会話欄・レビュー) が合図 (既定 /claude) で始まるときだけ動き、
# 差分をレビューしたり質問に答えたりする。各リポジトリから workflow_call で呼ぶ。
# Issue では動かさない: コメントの中身は push 前の検査を通らないので、書ける場所を PR に絞る
# (トークンに Issues の権限を付けない。PR の会話欄への返信は Pull requests の権限で書ける)。
# 呼び出し側の雛形は templates/.github/workflows/claude.yml。
#
# 使い方: コメントの先頭に合図を書き、空白か改行を挟んで頼む。
#         例:「/claude review」「/claude この変更で性能は落ちない?」
#         「/claudeレビューして」のように続けて書くと反応しない。
# 自動では走らせない: PR ごとに走らせると重複が多く、利用枠も減るため。
#
# 認証 (Secret は呼び出し側のリポジトリに置き、下の 3 つだけを明示して渡す):
#   CLAUDE_CODE_OAUTH_TOKEN … 必須。手元の Claude Code CLI で `claude setup-token`。
#       Claude のサブスクリプションの利用枠を使う (API の従量課金はかからない)。
#   AGENT_APP_ID / AGENT_APP_PRIVATE_KEY … 任意。自前の GitHub App のもの。
#       両方あれば、その App のトークン (このリポジトリだけ・下の権限だけに絞る) で動き、コメントがその App の名義になる。
#       無ければ GITHUB_TOKEN (呼び出し側の job の permissions) で動き、github-actions[bot] の名義になる。
#
# push はさせない: Actions のランナーには共通の git フックが無く、claude-code-action は
#       セッションの後に残った変更を自分で commit / push する (そのときはフックを切っている)。
#       公開リポジトリでは push した時点で公開されるので、push 前の検査を通らない経路は塞ぐ。
#       トークンの Contents を Read にしたうえで、Claude の git push も禁止する。
#       Claude GitHub App のトークンは Contents の Write が必ず付くので使わない。
#       変更を入れたいときは、手元かクラウドのセッション (共通のフックが入る) で行う。
#
# 権限: 公開リポジトリでは誰でもコメントできる。他人の合図で利用枠を使われないよう、
#       オーナー・メンバー・共同編集者のコメントだけに反応する。
#       呼び出し側の job で permissions を与える (共通側からは広げられない)。

name: Claude (共通)

on:
  workflow_call:
    inputs:
      trigger-phrase:
        description: "反応する合図。コメントがこれで始まるときだけ動く (例: /claude、@<App の名前>)"
        type: string
        default: /claude
      timeout-minutes:
        description: "暴走して利用枠を使い切らないための上限"
        type: number
        default: 30
    secrets:
      # required: true にすると、job の if (合図の判定) より前に呼び出しの時点で検査され、
      # Secret の無いリポジトリでは合図でない普通のコメントでも失敗の実行が残る。
      # 任意にして、合図で起動したときだけ下の step で止める。
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      AGENT_APP_ID:
        required: false
      AGENT_APP_PRIVATE_KEY:
        required: false

jobs:
  claude:
    # 先頭が合図のコメントだけで走らせる。contains にすると
    # 「https://claude.ai/...」のような URL にも当たり、ランナーが無駄に立ち上がる。
    if: >-
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
          startsWith(github.event.comment.body, inputs.trigger-phrase) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, inputs.trigger-phrase) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && startsWith(github.event.review.body, inputs.trigger-phrase) &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # secrets は step の if で直接使えないので、有無だけをここで真偽値にしておく。
      HAS_AGENT_APP: ${{ secrets.AGENT_APP_ID != '' && secrets.AGENT_APP_PRIVATE_KEY != '' }}
      HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

    steps:
      - name: Check secrets
        if: env.HAS_OAUTH_TOKEN != 'true'
        run: |
          echo "::error::Secret CLAUDE_CODE_OAUTH_TOKEN がこのリポジトリに無い。Settings → Secrets and variables → Actions に登録する (github-templates の README)"
          exit 1

      # 資格情報を残さない (checkout v6 以降は GITHUB_TOKEN の認証ヘッダーを
      # includeIf で読む別ファイルに置き、claude-code-action はそれを消せない)。
      # PR ブランチの fetch は認証なしで行うので、非公開リポジトリから呼ぶと
      # fetch で失敗する (呼び出し側は公開リポジトリだけ)。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # 自前の App があれば、このリポジトリだけ・読み書きはコメントだけに絞ったトークンを発行する。
      # permission-* を 1 つでも書くと、書かなかった権限はトークンに付かない。
      - name: GitHub App token
        id: app
        if: env.HAS_AGENT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-actions: read

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 自前の App が無ければ GITHUB_TOKEN。空にすると Claude GitHub App のトークン
          # (Contents の Write が必ず付く) になるので、空にはしない。
          github_token: ${{ steps.app.outputs.token || github.token }}
          trigger_phrase: ${{ inputs.trigger-phrase }}
          # job の actions: read だけでは Claude 側のトークンに渡らないので、
          # ここでも渡して CI の結果を読めるようにする
          additional_permissions: |
            actions: read
          # トークンで push できなくしてあるが、Claude が git push を試みて失敗を繰り返さないよう禁止もしておく。
          claude_args: --disallowedTools "Bash(git push:*)"
