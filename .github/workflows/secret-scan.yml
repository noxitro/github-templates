# 秘密情報スキャンの共通ワークフロー。各リポジトリから workflow_call で呼ぶ。
# 呼び出し側の雛形は templates/.github/workflows/secret-scan.yml。
#
# 検査器 (git-hooks/) はこのリポジトリから取り、検査対象のリポジトリの中身は使わない。
# 検査対象の側で検査器を無効化したり禁止リストを削ったりしても素通りさせないため。
#
# これは push が完了した後に走るので流出そのものは防げない。
# 防ぐのは手元のフック (git-hooks/pre-push) と、GitHub の push protection の役目。
# このワークフローは、その 2 つをすり抜けた場合に気付くための層。

name: Secret scan (共通)

on:
  workflow_call:
    inputs:
      hooks-ref:
        description: "検査器を取るこのリポジトリの ref。呼び出しを @<ref> で固定したときは同じ値を渡す"
        type: string
        default: main

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # 履歴を遡って差分を取るため

      # 検査器。検査対象の作業ツリーの中に置くが、検査は git の中身 (コミット・blob) だけを
      # 見るので、追跡されていないこのディレクトリが検査対象に混ざることはない。
      - uses: actions/checkout@v7
        with:
          repository: noxitro/github-templates
          ref: ${{ inputs.hooks-ref }}
          path: .nox-hooks
          persist-credentials: false

      # 1. 成果物の混入・ローカル絶対パス・個人メール・外部資料の名前など、
      #    汎用の秘密情報スキャナが対象にしない種類を見る (手元の pre-commit / pre-push と同じ scan.sh)。
      - name: Repo-specific scan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" "$SHA")
            echo "差分 $BEFORE..$SHA を検査する"
          else
            files=$(git ls-tree -r --name-only HEAD)
            echo "全ツリーを検査する (初回 push か、遡れない push か、pull_request)"
          fi
          if [ -z "$files" ]; then echo "対象ファイルなし"; exit 0; fi
          echo "$files" | wc -l | xargs echo "検査対象:"
          TAB=$(printf '\t')
          echo "$files" | while IFS= read -r f; do
            if [ -n "$f" ] && git cat-file -e "HEAD:$f" 2>/dev/null; then
              echo "${f}${TAB}HEAD:${f}"
            fi
          done | sh .nox-hooks/git-hooks/scan.sh

      # 2. コミットメッセージに外部資料の名前が無いか。ファイルの中身は 1. の scan.sh が見ている。
      #    メッセージは直すと履歴の書き換えになるので、手元の commit-msg / pre-push で止めるのが本筋。
      - name: External names in commit messages
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            revs=("$PR_BASE..$PR_HEAD")
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            revs=("$BEFORE..$SHA")
          else
            # 新規ブランチなど。既定ブランチに無いコミットだけを見る。
            revs=("$SHA" --not "origin/$DEFAULT_BRANCH")
          fi
          echo "検査範囲: ${revs[*]}"
          # --commits は残りの引数を全部取るので最後に置く
          python3 .nox-hooks/git-hooks/check-external-names.py --commits "${revs[@]}"

      # 3. 汎用スキャナ (gitleaks) で全履歴を見る。
      #    公式の gitleaks-action は使っていない。組織アカウントではライセンスキーを要求する仕様で、
      #    かつ可変タグ参照になるため。版と SHA256 は install-gitleaks.sh で固定している。
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          sh .nox-hooks/git-hooks/install-gitleaks.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # 設定はリポジトリの .gitleaks.toml、無ければ共通の git-hooks/gitleaks.toml (gitleaks.sh が選ぶ)。
      - name: Run gitleaks
        shell: bash
        run: sh .nox-hooks/git-hooks/gitleaks.sh
